name: publish-pypi
# Publishes to PyPI with Trusted Publishing (OIDC) — no API token is stored
# anywhere. One-time setup on pypi.org (project infinihash-kyt-mcp -> Publishing):
#   owner Infinihash, repository infinihash-kyt-mcp, workflow publish-pypi.yml, environment pypi
#
# Why (2026-10-05): main has carried the mcp<2 fix (0.1.3, PR #6) since it
# merged, but PyPI still serves 0.1.1, whose unpinned `mcp` resolves to 2.x and
# crashes on start ("'Server' object has no attribute 'list_tools'"). Nothing
# published the fix. The smoke job below would also have caught the original
# break: it installs the built wheel fresh and lists the tools over stdio.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Version must match the tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel fresh and list tools over stdio
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cat > /tmp/probe.py <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          async def main():
              async with stdio_client(StdioServerParameters(command="/tmp/v/bin/infinihash-kyt-mcp", args=[])) as (r, w):
                  async with ClientSession(r, w) as s:
                      await asyncio.wait_for(s.initialize(), 30)
                      tools = [t.name for t in (await asyncio.wait_for(s.list_tools(), 30)).tools]
                      print("TOOLS", tools)
                      assert "kyt_screen_wallet" in tools and len(tools) >= 10, tools
          asyncio.run(main())
          PY
          /tmp/v/bin/python /tmp/probe.py
  pypi:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
